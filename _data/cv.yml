  label: Postdoctoral Researcher | Fluid Mechanics & Planetary Science
  email: ca3alvarezzambrano@uwaterloo.ca
  location: Waterloo, ON, Canada
  image: ""
  summary: I am a quantitative fluid dynamicist and geomorphologist studying how wind, water, and gravity shape planetary surfaces — from sand dunes on Earth to the windswept landscapes of Mars. My research combines experimental and numerical approaches — including wind-tunnel and flume experiments, Particle Image Velocimetry (PIV), high-speed imaging, and CFD/DEM simulations — to tackle problems at the intersection of fluid mechanics, geomorphology, and planetary science.

